set -g mouse on

set -g status-style "bg=default"
set -g status-left ""
set -g window-status-separator ""
set -g window-status-current-format "#[bg=blue,fg=default] #W#{?window_zoomed_flag, 󰊓,} "
set -g window-status-format " #W#[fg=default blink]#{?window_bell_flag, 󰂚,}#{?window_activity_flag, 󰈈,}#{?window_silence_flag, 󰈈,} "
set -g window-status-bell-style ""
set -g window-status-activity-style ""
set -g status-right "#{?client_prefix,<Prefix> ,}#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}\"#{=21:pane_title}:#{session_name}\" %H:%M %d-%b-%y"
set -g mode-style "bg=blue"
set -g pane-active-border-style 'bg=default,fg=blue'
set -g pane-border-style 'bg=default,fg=black'
set -g message-style "bg=default"
